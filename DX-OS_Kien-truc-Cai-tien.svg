<text x="85" y="306" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Hồ sơ · dòng hàng · phê duyệt</text>
<rect x="480" y="242" width="390" height="87" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
<rect x="480" y="259" width="5" height="53" rx="2" fill="#2167a4"/>
<text x="500" y="276" font-size="22" fill="#2167a4" font-weight="700" text-anchor="start">Giờ công</text>
<text x="500" y="306" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Theo người/ngày · xét duyệt riêng</text>
<rect x="895" y="242" width="410" height="87" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
<rect x="895" y="259" width="5" height="53" rx="2" fill="#2167a4"/>
