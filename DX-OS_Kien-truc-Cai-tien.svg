<text x="85" y="1092" font-size="22" fill="#2167a4" font-weight="700" text-anchor="start">PostgreSQL · dữ liệu nóng</text>
<text x="85" y="1122" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">core.work_items + các bảng nghiệp vụ riêng</text>
<text x="85" y="1149" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Audit · sự kiện bền vững · phả hệ · pgvector</text>
<text x="85" y="1176" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Ràng buộc + giao dịch + phiên bản hồ sơ</text>
<rect x="750" y="1058" width="555" height="146" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
<rect x="750" y="1075" width="5" height="112" rx="2" fill="#147d72"/>
<text x="770" y="1092" font-size="22" fill="#147d72" font-weight="700" text-anchor="start">SeaweedFS / S3 · tệp &amp; lịch sử</text>
<text x="770" y="1122" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Tệp cách ly / tệp sạch tách quyền</text>
<text x="770" y="1149" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Parquet theo phiên bản và đợt xuất</text>
<text x="770" y="1176" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">BI / DuckDB truy vấn theo workspace</text>
<path d="M 715 1136 L 750 1136" fill="none" stroke="#52677c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="1242" font-size="21" fill="#132b43" font-weight="600" text-anchor="start">Đóng hồ sơ → xuất lịch sử có phiên bản → đối soát → công bố cho báo cáo.</text>
<text x="65" y="1278" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">API lệnh thuộc ứng dụng Tầng 3; gateway chỉ định tuyến. Trạng thái phê duyệt không mở cho CRUD tùy ý.</text>
