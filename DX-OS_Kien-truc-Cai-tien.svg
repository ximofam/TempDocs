<rect x="895" y="572" width="5" height="24" rx="2" fill="#147d72"/>
<text x="915" y="589" font-size="21" fill="#147d72" font-weight="700" text-anchor="start">Tiếp nhận OT &amp; trạng thái thiết bị</text>
<rect x="40" y="680" width="1290" height="640" rx="16" fill="#ffffff" stroke="#a9bbcc" stroke-width="1.5"/>
<text x="64" y="713" font-size="21" fill="#2167a4" font-weight="700" text-anchor="start">TẦNG 1 · HEADLESS OPEN-CORE PAAS</text>
<text x="64" y="741" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Dịch vụ kỹ thuật dùng chung; không cung cấp UI nghiệp vụ cho người dùng cuối.</text>
