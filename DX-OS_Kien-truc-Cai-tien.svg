<text x="64" y="456" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Một workspace thống nhất; mọi chức năng thực thi theo danh tính và quyền.</text>
<rect x="65" y="472" width="1240" height="65" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
