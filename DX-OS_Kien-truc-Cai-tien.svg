<text x="1405" y="402" font-size="22" fill="#79509b" font-weight="700" text-anchor="start">ArgoCD</text>
<text x="1405" y="432" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Đồng bộ hạ tầng và CR</text>
<path d="M 1560 454 L 1560 484" fill="none" stroke="#8a63b0" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#dasharrow)"/>
<rect x="1385" y="484" width="350" height="140" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
<rect x="1385" y="501" width="5" height="106" rx="2" fill="#79509b"/>
<text x="1405" y="518" font-size="22" fill="#79509b" font-weight="700" text-anchor="start">Go Operator</text>
<text x="1405" y="548" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Plan / apply / reconcile</text>
<text x="1405" y="575" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Pending → Applying</text>
<text x="1405" y="602" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Ready hoặc Failed</text>
<text x="1385" y="663" font-size="20" fill="#52677c" font-weight="400" text-anchor="start">Cấu hình: định danh, schema,</text>
<text x="1385" y="692" font-size="20" fill="#52677c" font-weight="400" text-anchor="start">quyền Hasura, flow và route.</text>
<text x="1385" y="736" font-size="18" fill="#79509b" font-weight="600" text-anchor="start">Sửa cả quyền thiếu và quyền thừa.</text>
<path d="M 1385 586 L 1345 586 L 1345 718 L 1330 718" fill="none" stroke="#8a63b0" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#dasharrow)"/>
<rect x="1360" y="810" width="400" height="510" rx="16" fill="#fff8eb" stroke="#d6bb85" stroke-width="1.5"/>
<text x="1384" y="843" font-size="21" fill="#b87516" font-weight="700" text-anchor="start">DỊCH VỤ &amp; QUY TẮC LÕI</text>
<text x="1384" y="871" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Áp dụng xuyên suốt các đường truy cập.</text>
<rect x="1385" y="896" width="350" height="112" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
