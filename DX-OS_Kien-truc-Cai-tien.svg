<text x="675" y="936" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Điều phối &amp; thử lại</text>
<text x="675" y="963" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Chống tác động trùng</text>
