<text x="1405" y="930" font-size="22" fill="#b87516" font-weight="700" text-anchor="start">OpenBao</text>
<text x="1405" y="960" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Bí mật / khóa ký</text>
<text x="1405" y="987" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Checkpoint ngoài PostgreSQL</text>
<text x="1385" y="1052" font-size="19" fill="#132b43" font-weight="700" text-anchor="start">Workspace × ứng dụng × hành động</text>
<text x="1385" y="1086" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Tài khoản dịch vụ tối thiểu quyền.</text>
<text x="1385" y="1120" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">AI / BI / tệp cùng kiểm tra tenant.</text>
<text x="1385" y="1172" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Audit: ghi đồng thời an toàn,</text>
<text x="1385" y="1202" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">checkpoint độc lập và đối soát.</text>
<text x="1385" y="1255" font-size="18" fill="#b87516" font-weight="600" text-anchor="start">Phát hiện sửa đổi trong phạm vi</text>
<text x="1385" y="1282" font-size="18" fill="#b87516" font-weight="600" text-anchor="start">dữ liệu đã được neo và bảo vệ.</text>
<text x="42" y="1364" font-size="20" fill="#52677c" font-weight="400" text-anchor="start">Sơ đồ logic: thể hiện tầng, trách nhiệm và các kết nối chính; không phải sơ đồ triển khai vật lý.</text>
<text x="42" y="1395" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Mũi tên liền: phụ thuộc / dữ liệu chính. Nét đứt: điều phối cấu hình. Các tuyến phụ được lược bớt.</text>
</g></svg>
