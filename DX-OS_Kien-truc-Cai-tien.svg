<rect width="100%" height="100%" fill="#f6f8fc"/>
<g font-family="Liberation Sans, DejaVu Sans, sans-serif">
<text x="42" y="49" font-size="19" fill="#2167a4" font-weight="700" text-anchor="start">DX-OS / OPEN-CORE</text>
<text x="42" y="96" font-size="37" fill="#132b43" font-weight="700" text-anchor="start">Kiến trúc hệ thống cải tiến</text>
<text x="42" y="130" font-size="21" fill="#52677c" font-weight="400" text-anchor="start">Phương án đề xuất: Hasura · dữ liệu nghiệp vụ độc lập · workflow có thể phục hồi</text>
<rect x="1460" y="48" width="300" height="42" rx="21" fill="#e8eefb" stroke="#d4def0" stroke-width="1.5"/>
<text x="1610" y="76" font-size="18" fill="#2167a4" font-weight="700" text-anchor="middle">THIẾT KẾ ĐỀ XUẤT</text>
<rect x="40" y="165" width="1290" height="190" rx="16" fill="#edf4ff" stroke="#91b4df" stroke-width="1.5"/>
<text x="64" y="198" font-size="21" fill="#2167a4" font-weight="700" text-anchor="start">TẦNG 3 · ỨNG DỤNG NGHIỆP VỤ</text>
<text x="64" y="226" font-size="17" fill="#52677c" font-weight="400" text-anchor="start">Mỗi ứng dụng sở hữu hồ sơ, quy tắc và API lệnh của mình.</text>
<rect x="65" y="242" width="390" height="87" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
