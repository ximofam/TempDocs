<text x="85" y="506" font-size="23" fill="#147d72" font-weight="700" text-anchor="start">Workspace Portal · [H] Công việc / lịch  ·  [P] Hộp duyệt  ·  [D] Báo cáo  ·  [I] Trợ lý</text>
<rect x="65" y="555" width="390" height="58" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
