<text x="85" y="936" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">SSO / OIDC / MFA</text>
<text x="85" y="963" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Danh tính &amp; vai trò</text>
<rect x="330" y="872" width="300" height="114" rx="16" fill="white" stroke="#cfdae5" stroke-width="1.5"/>
<rect x="330" y="889" width="5" height="80" rx="2" fill="#2167a4"/>
