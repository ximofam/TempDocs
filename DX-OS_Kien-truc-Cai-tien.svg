<rect x="65" y="774" width="5" height="36" rx="2" fill="#2167a4"/>
<text x="85" y="791" font-size="24" fill="#2167a4" font-weight="700" text-anchor="start">Apache APISIX · Gateway / xác thực biên / định tuyến / giới hạn truy cập</text>
<text x="85" y="810" font-size="18" fill="#52677c" font-weight="400" text-anchor="start">Các tuyến phục vụ CRUD, API lệnh của ứng dụng, tệp, AI, BI và dữ liệu thiết bị.</text>
