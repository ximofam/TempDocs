<text x="1000" y="936" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Upload → cách ly → quét</text>
<text x="1000" y="963" font-size="19" fill="#52677c" font-weight="400" text-anchor="start">Chỉ dùng tệp sạch</text>
