<title id="title">DX-OS — Kiến trúc hệ thống cải tiến</title><desc id="desc">Kiến trúc logic ba tầng theo phương án giữ Hasura, tách GitOps, dữ liệu chung và dữ liệu nghiệp vụ.</desc>
